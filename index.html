<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>อุณหภูมิ บ้านเอื้ออาทรแม่กลอง</title>
<style>
:root{--bg:#eef6fb;--card:#ffffff;--text:#16324a;--muted:#5b7488;--accent:#e8731a;--line:#d6e4ee;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1b27;--card:#172a3a;--text:#e8f1f8;--muted:#9bb2c4;--accent:#ffa24d;--line:#25405a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0e1b27;--card:#172a3a;--text:#e8f1f8;--muted:#9bb2c4;--accent:#ffa24d;--line:#25405a;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:"Sarabun","Noto Sans Thai",system-ui,sans-serif;line-height:1.5}
main{max-width:760px;margin:0 auto;padding:20px 16px 40px}
h1{font-size:1.4rem;margin:0 0 2px}
.sub{color:var(--muted);margin:0 0 18px;font-size:.95rem}
.hero{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:24px;text-align:center}
.temp{font-size:4.5rem;font-weight:700;color:var(--accent);line-height:1}
.temp small{font-size:1.8rem}
.cond{font-size:1.15rem;margin-top:6px}
.meta{display:flex;justify-content:center;gap:20px;margin-top:14px;color:var(--muted);flex-wrap:wrap}
.toggle{margin:16px auto 0;display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.toggle button{border:0;background:transparent;color:var(--text);padding:6px 18px;font:inherit;cursor:pointer}
.toggle button.on{background:var(--accent);color:#fff}
h2{font-size:1.1rem;margin:26px 0 10px}
.days{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.day{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;text-align:center}
.day b{display:block}
.day .hi{color:var(--accent);font-weight:700;font-size:1.2rem}
.day .lo{color:var(--muted)}
.day .rain{font-size:.85rem;color:var(--muted);margin-top:4px}
footer{margin-top:24px;color:var(--muted);font-size:.85rem}
</style>
</head>
<body>
<main>
  <h1>🏘️ บ้านเอื้ออาทรแม่กลอง</h1>
  <p class="sub">ต.แม่กลอง อ.เมือง จ.สมุทรสงคราม · ข้อมูล ณ วันที่ 22 ต.ค. 2569</p>

  <section class="hero">
    <div style="font-size:3rem" aria-hidden="true">⛅</div>
    <div class="temp"><span id="now">32.3</span><small id="u">°C</small></div>
    <div class="cond">มีแดดบางส่วน · เมฆบางส่วน</div>
    <div class="meta"><span>สูงสุดวันนี้ <b id="hiNow">32.4</b></span><span>ต่ำสุด <b id="loNow">24.8</b></span><span>โอกาสฝน 30%</span></div>
    <div class="toggle" role="group" aria-label="หน่วยอุณหภูมิ">
      <button id="bc" class="on" type="button">°C</button>
      <button id="bf" type="button">°F</button>
    </div>
  </section>

  <h2>พยากรณ์ 8 วัน</h2>
  <div class="days" id="days"></div>

  <footer>หมายเหตุ: เป็นข้อมูลพยากรณ์ของพื้นที่แม่กลอง ณ เวลาที่สร้างหน้านี้ ไม่ได้อัปเดตสดอัตโนมัติ</footer>
</main>
<script>
const F={now:90.2,days:[
["พฤ.",90.3,76.7,30],["ศ.",90.8,77.8,15],["ส.",90.3,77.7,15],["อา.",90.0,78.3,15],
["จ.",86.6,75.5,25],["อ.",88.5,75.5,15],["พ.",86.2,75.6,70],["พฤ.",88.6,76.3,15]]};
let unit="C";
const cv=f=>unit==="C"?((f-32)*5/9).toFixed(1):f.toFixed(1);
function render(){
  document.getElementById("now").textContent=cv(F.now);
  document.getElementById("u").textContent="°"+unit;
  document.getElementById("hiNow").textContent=cv(F.days[0][1])+"°";
  document.getElementById("loNow").textContent=cv(F.days[0][2])+"°";
  document.getElementById("days").innerHTML=F.days.map((d,i)=>
    `<div class="day"><b>${i===0?"วันนี้":d[0]}</b><div class="hi">${cv(d[1])}°</div><div class="lo">${cv(d[2])}°</div><div class="rain">🌧 ${d[3]}%</div></div>`).join("");
  document.getElementById("bc").classList.toggle("on",unit==="C");
  document.getElementById("bf").classList.toggle("on",unit==="F");
}
document.getElementById("bc").onclick=()=>{unit="C";render()};
document.getElementById("bf").onclick=()=>{unit="F";render()};
render();
</script>
</body>
</html>
